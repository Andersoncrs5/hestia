services:
  postgres:
    image: postgres:18-alpine
    container_name: hestia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hestia
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: hestia

    ports:
      - "5432:5432"

    volumes:
      - hestia_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia -d hestia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hestia_postgres_data:
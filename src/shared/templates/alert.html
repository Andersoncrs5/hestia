{% if messages %}
<div id="alert-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3 w-full max-w-md px-4">
    {% for message in messages %}
        <div 
            x-data="{ show: true }"
            x-show="show"
            x-init="setTimeout(() => show = false, 4000)"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 -translate-y-2 scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
            class="flex items-center justify-between p-4 rounded-xl border backdrop-blur-md shadow-xl text-sm font-medium
                {% if message.tags == 'success' %}
                    bg-emerald-950/80 border-emerald-500/30 text-emerald-200
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    bg-rose-950/80 border-rose-500/30 text-rose-200
                {% elif message.tags == 'warning' %}
                    bg-amber-950/80 border-amber-500/30 text-amber-200
                {% else %}
                    bg-sky-950/80 border-sky-500/30 text-sky-200
                {% endif %}"
            role="alert"
        >
            <div class="flex items-center gap-3">
                {% if message.tags == 'success' %}
                    <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    <i class="fa-solid fa-circle-xmark text-rose-400 text-lg"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info text-sky-400 text-lg"></i>
                {% endif %}
                
                <span>{{ message }}</span>
            </div>

            <button @click="show = false" type="button" class="text-white/50 hover:text-white transition ml-4">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>
    {% endfor %}
</div>
{% endif %}

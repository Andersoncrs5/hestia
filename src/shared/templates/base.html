{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Hestia{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >

    {% block styles %}{% endblock %}
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">

    {% block nav %}
    {% endblock %}

    <main class="mx-auto max-w-7xl px-6 py-8">

        {% block header %}
        {% endblock %}

        {% block content %}
        {% endblock %}

        {% block footer %}
        {% endblock %}

    </main>

    {% block scripts %}
    {% endblock %}

</body>
</html>
